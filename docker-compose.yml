version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: tongue_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: tongue_db
      MYSQL_USER: tongue_user
      MYSQL_PASSWORD: tongue_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tongue_backend_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=mysql+pymysql://tongue_user:tongue_password@db:3306/tongue_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=gemini-2.5-flash
      - SECRET_KEY=tongue-analyzer-production-docker-secret-2026
    ports:
      - "8000:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_reports:/app/generated_reports
      - ./knowledge_base:/knowledge_base:ro
      - ./ai_models/checkpoints:/ai_models/checkpoints:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tongue_frontend_web
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data:
  backend_uploads:
  backend_reports:
